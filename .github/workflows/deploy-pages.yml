name: Deploy to GitHub Pages
run-name: Deploy site from main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Shivaji Raje/package-lock.json

      - name: Install dependencies
        working-directory: Shivaji Raje
        run: npm ci

      - name: Build site
        working-directory: Shivaji Raje
        run: npm run build

      - name: Check source content
        working-directory: Shivaji Raje
        run: node scripts/verify.mjs --content-only

      - name: Run browser checks
        working-directory: Shivaji Raje
        run: |
          npm run dev -- --port 5173 --strictPort &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/index.html >/dev/null; then break; fi
            sleep 1
          done
          npm test
          node scripts/verify-motion.mjs
          node scripts/verify-museum.mjs
          node scripts/verify-a11y.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Shivaji Raje/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4